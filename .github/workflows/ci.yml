name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group dev
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Cache the published documents
        uses: actions/cache@v4
        with:
          path: ~/.cache/bbfmodels
          key: bbf-documents-${{ hashFiles('src/bbfmodels/sources.py') }}
      - name: Fetch the published documents
        run: uv run bbfmodels fetch
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Build
        run: uv build

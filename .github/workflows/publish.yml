name: publish

# Runs on the vX.Y.Z tag that merging the Release PR creates. Builds the
# wheel and sdist, attaches them to the GitHub release, and publishes to
# PyPI through trusted publishing: PyPI trusts this repository's workflow
# by name and environment, so no token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Cache the published documents
        uses: actions/cache@v4
        with:
          path: ~/.cache/bbfmodels
          key: bbf-documents-${{ hashFiles('src/bbfmodels/sources.py') }}
      - name: Fetch the published documents
        run: uv run bbfmodels fetch
      - name: Test
        run: uv run pytest -q
      - name: The package version is the tag
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "pyproject.toml says $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bbfmodels/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

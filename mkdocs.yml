site_name: bbfmodels
site_description: Typed models and schema tooling for Broadband Forum data models, generated from the published XML.
site_url: https://docs.bbfmodels.ispx.co/
copyright: Copyright &copy; ISPX LIMITED

theme:
  name: shadcn
  icon: assets/images/ispx-icon.png
  topbar_sections: false
  pygments_style:
    light: shadcn-light
    dark: github-dark

plugins:
  - search

hooks:
  - hooks/changelog.py

markdown_extensions:
  admonition:
  codehilite:
  fenced_code:
  footnotes:
  tables:
  attr_list:
  md_in_html:
  toc:
    permalink: true
  pymdownx.blocks.details:
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.snippets:
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/js/copy-code.js
  - assets/js/powered-by.js

nav:
  - Home: index.md
  - Changelog: changelog.md
